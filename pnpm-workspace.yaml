packages:
  - "packages/*"
overrides:
  # drizzle-kit still pulls the deprecated @esbuild-kit chain, which pins esbuild 0.18.20.
  # That version lets any website talk to a running esbuild dev server and read the response
  # (GHSA-67mh-4wv8-2f99). Nothing here runs an esbuild dev server, and drizzle-kit is a
  # development dependency, so there is no production exposure. It is still the last open
  # advisory, and the upstream chain is abandoned, so pin the nested copy forward instead of
  # waiting for a fix that is not coming. 0.25.12 is the version drizzle-kit already depends
  # on directly, so this deduplicates rather than adding a package.
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
allowBuilds:
  esbuild: true
  # The optional recognition engine. Its install script exists to download the GPU execution
  # provider binaries, which are too large to ship on the registry. The processor binaries this
  # project actually uses are already inside the package, and nothing here runs recognition on a
  # GPU, so the script is denied and the engine still works. Listed even though the package is
  # not installed by default, so that installing it later needs no answer to a prompt.
  onnxruntime-node: false
  # Its only install script prints a funding banner. Nothing about the engine needs it to run,
  # so it is denied rather than allowed: an install script that earns nothing should not execute.
  tesseract.js: false
# The shared ingestion library is ours, so it is exempt from the minimum-release-age gate that
# holds back freshly published third-party versions. Named without a version so a new release does
# not have to be added here each time.
minimumReleaseAgeExclude:
  - '@orbitqube/oq-ai-ocr'
